name: Bug report
description: A datapack isn't working as expected in game.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please include enough detail to reproduce it.
  - type: dropdown
    id: pack
    attributes:
      label: Datapack
      options: [Cauldron Copper]
    validations:
      required: true
  - type: input
    id: pack-version
    attributes:
      label: Datapack version
      description: The version in the zip's file name.
      placeholder: 1.0.1
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      placeholder: "26.3"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where are you running it?
      options: [Singleplayer, Vanilla server, Paper / Spigot / Purpur, Fabric / NeoForge server, Realms, Other]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Fill a cauldron with water
        2. ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: latest.log
      description: Paste `logs/latest.log`, or link a gist or mclo.gs upload. Datapack load errors show up here.
      render: text
  - type: textarea
    id: others
    attributes:
      label: Other datapacks, mods or plugins installed
