name: Lint

# No `push` or `merge_group` trigger: every change reaches main through a pull request that
# already ran these hooks, and the repository has no merge queue.
on:
  pull_request:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    uses: studiobimo/.github/.github/workflows/ci-lint.yml@v1
